name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to Floci
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.FLOCI_HOST }}
          username: ${{ secrets.FLOCI_USER }}
          key: ${{ secrets.FLOCI_SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop resume-analyzer 2>/dev/null || true
            docker rm resume-analyzer 2>/dev/null || true
            docker run -d \
              --name resume-analyzer \
              --network floci-localstack_default \
              --restart unless-stopped \
              -p 8080:8080 \
              -e AWS_ENDPOINT_URL=http://floci:4566 \
              -e AWS_DEFAULT_REGION=us-east-1 \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_SECRETS_ENABLED=true \
              ghcr.io/${{ github.repository }}:latest
            sleep 3
            curl -sf http://localhost:8080/ || echo "Health check failed"
