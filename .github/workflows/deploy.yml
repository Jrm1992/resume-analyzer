name: Build & Deploy to Floci (Production)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (default: git sha)"
        required: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/resume-analyzer
  TF_VERSION: "1.9"
  FLOCI_RUNNER_LABEL: floci-runner

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.image_tag || github.sha }}

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  deploy:
    name: Deploy to Floci via Terraform
    needs: build-and-push
    runs-on: [self-hosted, floci-runner]
    defaults:
      run:
        working-directory: infra
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Restore Terraform State
        run: |
          mkdir -p ../../tfstate
          if [ -f ../../tfstate/terraform.tfstate ]; then
            cp ../../tfstate/terraform.tfstate .
            echo "Restored terraform state from ../../tfstate"
          fi

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate


      - name: Terraform Import Existing Resources
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          set +e
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.iam.aws_iam_role.task[0] resume-analyzer-prod-task || true
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.iam.aws_iam_role.execution[0] resume-analyzer-prod-execution || true
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.taskdef.aws_cloudwatch_log_group.main /ecs/resume-analyzer-prod || true
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.alb.aws_lb.main "arn:aws:elasticloadbalancing:us-east-1:000000000000:loadbalancer/app/resume-analyzer-prod/930b5dd2f8144d9b" || true
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.loadbalancer.aws_lb_target_group.main "arn:aws:elasticloadbalancing:us-east-1:000000000000:targetgroup/resume-analyzer-prod/2c2d9de344c748fa" || true
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.alb.aws_lb_listener.main "arn:aws:elasticloadbalancing:us-east-1:000000000000:listener/app/resume-analyzer-prod/930b5dd2f8144d9b/a11051623bf044a2" || true
          terraform import \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            module.loadbalancer.aws_lb_listener_rule.main "arn:aws:elasticloadbalancing:us-east-1:000000000000:listener-rule/app/resume-analyzer-prod/930b5dd2f8144d9b/a11051623bf044a2/fdf91eca37774537" || true
          set -e

      - name: Terraform Plan
        id: plan
        run: |
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          terraform plan \
            -var-file="environments/prod.tfvars" \
            -var="image_tag=${IMAGE_TAG}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

      - name: Save Terraform State
        if: always()
        run: |
          mkdir -p ../../tfstate
          cp terraform.tfstate ../../tfstate/terraform.tfstate